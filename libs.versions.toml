[versions]
kotlin = "2.4.21"
kronos = "0.4.0"
mysql-jdbc-driver = { strictly = "9.7.0" }
druid = { strictly = "1.2.28" }
hibernate = "7.4.14.Final"
jimmer = "0.12.4"
ktorm = "4.2.1"
mybatisPlus = "3.5.18.1"
mybatisCore = { strictly = "3.5.19" }
ksp = "2.3.12"
jackson = "2.22.4"
jacksonAnnotations = "2.22"
jmh = "1.37"

[libraries]
driver-jdbc-mysql = { module = "com.mysql:mysql-connector-j", version.ref = "mysql-jdbc-driver" }
druid = { module = "com.alibaba:druid", version.ref = "druid" }
hibernate-core = { module = "org.hibernate.orm:hibernate-core", version.ref = "hibernate" }
jimmer-core = { module = "org.babyfish.jimmer:jimmer-core-kotlin", version.ref = "jimmer" }
jimmer-sql = { module = "org.babyfish.jimmer:jimmer-sql-kotlin", version.ref = "jimmer" }
jimmer-ksp = { module = "org.babyfish.jimmer:jimmer-ksp", version.ref = "jimmer" }
kronos-core = { module = "com.kotlinorm:kronos-core", version.ref = "kronos" }
kronos-jdbc-wrapper = { module = "com.kotlinorm:kronos-jdbc-wrapper", version.ref = "kronos" }
ktorm = { module = "org.ktorm:ktorm-core", version.ref = "ktorm" }
mybatis-plus = { module = "com.baomidou:mybatis-plus", version.ref = "mybatisPlus" }
mybatis-core = { module = "org.mybatis:mybatis", version.ref = "mybatisCore" }
jackson-module = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jacksonAnnotations" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-noArg = { id = "org.jetbrains.kotlin.plugin.noarg", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
kronos-gradle-plugin = { id = "com.kotlinorm.kronos-gradle-plugin", version.ref = "kronos" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
