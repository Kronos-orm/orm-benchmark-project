name: Publish reviewed benchmark report

on:
  workflow_dispatch:
    inputs:
      report_source_sha:
        description: Exact commit in this repository containing the reviewed publication/ bundle
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-result-publication
  cancel-in-progress: false

jobs:
  publish-report:
    name: Validate and publish the reviewed report bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check immutable report source identity
        env:
          REPORT_SOURCE_SHA: ${{ inputs.report_source_sha }}
        run: |
          if [[ ! "$REPORT_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'report_source_sha must be an exact 40-character commit SHA'
            exit 1
          fi
      - name: Checkout publication validator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Checkout reviewed report data
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.report_source_sha }}
          path: report-source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify website and evidence contract
        run: python source/scripts/validate_publication.py report-source/publication --expected-public-base https://raw.githubusercontent.com/Kronos-orm/orm-benchmark-project/result
      - name: Preserve reviewed publication bundle
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-benchmark-report
          path: report-source/publication
          if-no-files-found: error
      - name: Publish the website Markdown and versioned evidence
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: result
          folder: report-source/publication
          clean: false
          single-commit: false
          commit-message: Publish reviewed benchmark report from ${{ inputs.report_source_sha }}
